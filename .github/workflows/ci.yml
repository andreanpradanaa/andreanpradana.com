name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint && pnpm format:check
      - name: Build (menghasilkan tipe global untuk typecheck)
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://andreanpradana.com' }}
      - name: Typecheck
        run: pnpm typecheck
      - name: Test + coverage (ambang 80%)
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  deploy:
    # Hanya push ke main, setelah semua pemeriksaan lulus. Lihat deploy/README.md.
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://andreanpradana.com
      - name: Siapkan kunci SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            # Fallback bila secret belum diisi: ambil host key saat ini (trust on first use)
            ssh-keyscan -p "${{ secrets.VPS_PORT }}" -t ed25519 "${{ secrets.VPS_HOST }}" > ~/.ssh/known_hosts
          fi
      - name: Rsync out/ ke VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }}" \
            out/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/andreanpradana.com/"
