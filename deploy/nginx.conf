# /etc/nginx/sites-available/andreanpradana.com
# Static export Next.js (folder out/) untuk andreanpradana.com.
# Aktifkan: ln -s /etc/nginx/sites-available/andreanpradana.com /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name andreanpradana.com www.andreanpradana.com;

    # Dibutuhkan certbot --webroot saat penerbitan/renewal sertifikat
    location /.well-known/acme-challenge/ {
        root /var/www/andreanpradana.com;
    }

    location / {
        return 301 https://andreanpradana.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.andreanpradana.com;

    ssl_certificate /etc/letsencrypt/live/andreanpradana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andreanpradana.com/privkey.pem;

    return 301 https://andreanpradana.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name andreanpradana.com;

    ssl_certificate /etc/letsencrypt/live/andreanpradana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andreanpradana.com/privkey.pem;

    root /var/www/andreanpradana.com;
    index index.html;

    # Rute Next.js tanpa trailing slash: /foo -> /foo.html -> /foo/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # OG image hasil export tidak berekstensi; pastikan MIME-nya PNG
    location = /opengraph-image {
        default_type image/png;
        expires 7d;
    }

    # Aset ber-hash dari Next.js aman di-cache lama
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
